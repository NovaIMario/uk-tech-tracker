name: Update roles and deploy

on:
  schedule:
    # Every two hours from 06:17 to 22:17 UTC.
    - cron: '17 6-22/2 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # the script stops starting new boards after 13 minutes
    outputs:
      # Scheduled runs redeploy only when the roles changed; pushes and manual runs always do.
      deploy: ${{ steps.commit.outputs.changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Read employer job boards
        run: node scripts/fetch-jobs.mjs
      - name: Commit changed data
        id: commit
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update roles $(date -u +%Y-%m-%d)"
            git push || echo "::warning::Could not push the data commit; the next run will retry."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes."
          fi
      - uses: actions/configure-pages@v6
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: .

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
